name: generate-culture-feed

on:
  schedule:
    # 06:00 and 17:00 JST
    - cron: "0 21 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate RSS
        run: python3 feeds/culture/generate.py docs/culture.xml
      - name: Commit if changed
        run: |
          git config user.name "Signboard-Feeds bot"
          git config user.email "actions@github.com"
          git add docs/culture.xml
          git diff --cached --quiet || git commit -m "Update culture feed"
          git push
